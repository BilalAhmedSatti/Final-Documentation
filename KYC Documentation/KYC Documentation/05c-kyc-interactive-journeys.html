<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KYC customer journeys</title>
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --ink: #1a2332;
    --muted: #5c6b80;
    --line: #d8dee8;
    --line-strong: #c3ccd8;
    --accent: #1e4e8c;
    --accent-soft: #e8f0fa;
    --success: #0f6b45;
    --success-soft: #e6f5ee;
    --danger: #b42318;
    --danger-soft: #fdecea;
    --warn: #8a5a00;
    --warn-soft: #fff6e0;
    --wait: #5b4aa8;
    --wait-soft: #f1eefc;
    --shadow: 0 0 0 1px var(--line);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  .app {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    height: 100%;
  }
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .brand {
    padding: 20px 18px 12px;
    border-bottom: 1px solid var(--line);
  }
  .brand h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  .brand p {
    margin: 6px 0 0;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.45;
  }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 18px 0;
  }
  .filters button, .toolbar button, .walk button, .related button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 12px;
  }
  .filters button.active, .journey.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .search {
    padding: 10px 18px 8px;
  }
  .search input {
    width: 100%;
    font: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
  }
  .search input:focus {
    outline: 2px solid var(--accent-soft);
    border-color: var(--accent);
  }
  .journeys {
    flex: 1;
    overflow: auto;
    padding: 4px 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .journey {
    display: flex;
    gap: 8px;
    align-items: baseline;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink);
  }
  .journey:hover { background: var(--accent-soft); }
  .journey span {
    flex: 0 0 48px;
    font-size: 11px;
    font-weight: 650;
    color: var(--muted);
  }
  .journey.active span { color: #cfe0f5; }
  .legend {
    padding: 12px 18px 16px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 12px;
  }
  .legend i {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: middle;
  }
  .main {
    display: grid;
    grid-template-rows: auto minmax(480px, 1fr) minmax(280px, 34vh);
    min-width: 0;
    min-height: 0;
  }
  .top {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 12px 22px 10px;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
  }
  .title {
    margin: 0;
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.03em;
  }
  .meta { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .why {
    margin-top: 8px;
    padding: 8px 10px;
    background: var(--accent-soft);
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.4;
  }
  .facts {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }
  .fact {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    background: var(--bg);
  }
  .fact b {
    display: block;
    font-size: 11px;
    color: var(--muted);
    font-weight: 650;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .fact span { font-size: 12px; line-height: 1.4; }
  .toolbar { display: flex; gap: 6px; flex-shrink: 0; }
  .walk { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .walk .count { font-size: 12px; color: var(--muted); }
  .canvas {
    position: relative;
    overflow: auto;
    background: var(--bg);
    min-height: 480px;
  }
  svg { display: block; }
  .node { cursor: pointer; }
  .node .box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; }
  .node.selected .box { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
  .node.success .bar { fill: var(--success); }
  .node.fail .bar { fill: var(--danger); }
  .node.decision .bar { fill: var(--warn); }
  .node.wait .bar { fill: var(--wait); }
  .node.action .bar { fill: var(--accent); }
  .node-html {
    font-family: "Segoe UI", system-ui, sans-serif;
    padding: 8px 10px 8px 14px;
    height: 100%;
  }
  .n-label {
    font-size: 14px;
    font-weight: 650;
    line-height: 1.3;
    color: var(--ink);
  }
  .n-kind {
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .n-state {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .edge { fill: none; stroke: #8b9bb0; stroke-width: 1.4; marker-end: url(#arrow); }
  .edge-label {
    font-size: 10px;
    fill: #5c6b80;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .details {
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 16px 22px 18px;
    display: grid;
    grid-template-columns: 1.1fr 1.3fr 1.3fr 1fr;
    gap: 18px;
    min-height: 280px;
    overflow: auto;
  }
  .details h3 {
    margin: 0 0 6px;
    font-size: 11px;
    font-weight: 650;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .details p { margin: 0; font-size: 13px; line-height: 1.5; }
  .step-title { font-size: 16px; font-weight: 650; margin: 0 0 6px; }
  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--muted);
    margin-left: 6px;
    vertical-align: middle;
    text-transform: uppercase;
  }
  .related { display: flex; flex-wrap: wrap; gap: 6px; }
  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 220px 1fr; }
    .facts { grid-template-columns: 1fr; }
    .details { grid-template-columns: 1fr; min-height: 240px; }
    .main { grid-template-rows: auto minmax(360px, 1fr) minmax(240px, 40vh); }
    .canvas { min-height: 360px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>KYC customer journeys</h1>
      <p>38 customer-facing paths for the Conventional DRB pack. Click a journey, then a step.</p>
    </div>
    <div id="filters" class="filters"></div>
    <div class="search"><input id="q" type="search" placeholder="Search journeys, personas, IDs" autocomplete="off"></div>
    <div id="journeys" class="journeys"></div>
    <div class="legend">
      <div><i style="background:#1e4e8c"></i>Action</div>
      <div><i style="background:#8a5a00"></i>Decision</div>
      <div><i style="background:#0f6b45"></i>Success</div>
      <div><i style="background:#b42318"></i>Fail / stop</div>
      <div><i style="background:#5b4aa8"></i>Wait</div>
      <div>Source: 05b catalog</div>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="top-row">
        <div>
          <h2 id="title" class="title"></h2>
          <p id="meta" class="meta"></p>
        </div>
        <div class="toolbar">
          <button type="button" id="zoomOut">-</button>
          <button type="button" id="zoomIn">+</button>
          <button type="button" id="fitBtn">Fit</button>
        </div>
      </div>
      <div id="why" class="why"></div>
      <div id="facts" class="facts"></div>
      <div class="walk">
        <button type="button" id="prevBtn">Previous step</button>
        <button type="button" id="nextBtn">Next step</button>
        <span id="count" class="count"></span>
      </div>
    </header>
    <section id="canvas" class="canvas">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 z" fill="#8b9bb0"></path>
          </marker>
        </defs>
        <g id="viewport"></g>
      </svg>
    </section>
    <section id="details" class="details"></section>
  </main>
</div>

const DATA=[{"id":"UJ-01","family":"A","title":"Happy path STP","persona":"Ayesha — salaried, resident CNIC","classTag":"A CDD/BV/TAT · C progress","why":"Low-risk resident completes NADRA BV. Screening is clear. Account goes straight to ACTIVE.","trigger":"Taps Open account. Eligible resident CNIC. BV succeeds. Screening clear. CRP LOW.","success":"Full product limits. Home dashboard. TMS enrolled. State ACTIVE.","alternate":"Any fail branches to UJ-04 through UJ-25.","related":["UJ-02","UJ-04","UJ-09","UJ-27"],"walk":["open","track","otp","sms","consent","id","photo","bv","profile","screen","risk","pin"],"nodes":[{"id":"open","label":"Open account","kind":"action","customer":"Opens app or web and taps Open savings/current account.","system":"Creates application. Captures channel, device hash, IP, geo if permitted.","state":"INITIATED","from":"","to":""},{"id":"track","label":"Tracking ID on screen","kind":"action","customer":"Sees Tracking ID. Can copy it. No SMS yet — no mobile collected.","system":"Issues Tracking ID. Shows it in-app only.","state":"INITIATED","from":"","to":""},{"id":"otp","label":"Mobile OTP","kind":"action","customer":"Enters PTA-registered mobile and OTP.","system":"Sends OTP. Verifies. Binds mobile. Does not skip state on wrong OTP.","state":"CONTACT_VERIFIED","from":"","to":""},{"id":"sms","label":"SMS Tracking ID","kind":"action","customer":"Receives SMS: application started + Tracking ID.","system":"First out-of-band notify. Only after OTP success — not to an unverified number.","state":"CONTACT_VERIFIED","from":"","to":""},{"id":"consent","label":"Consents","kind":"action","customer":"Accepts T&Cs, privacy, KFS, NADRA/BV. Marketing off by default.","system":"Stores versioned consents. Blocks continue until mandatory accepted.","state":"CONSENT_CAPTURED","from":"","to":""},{"id":"id","label":"CNIC identity","kind":"action","customer":"Enters or confirms Table-A identity (CNIC, names, DOB, dates).","system":"Format/checksum validation. En  prefill","persona":"Ayesha — already KYC’d at another bank","classTag":"A when platform live + consent","why":"Optional consent lets the bank prefill KYC. BV and sanctions still run. Miss or timeout continues locally.","trigger":"Customer accepts optional Shared e-KYC consent and the platform is live.","success":"Prefill confirmed. Customer still owns accuracy. Then live photo + BV.","alternate":"Decline, miss, or error → silent continue to local identity form (UJ-01).","related":["UJ-01","UJ-05"],"walk":["consent","lookup","hit","review","continue"],"nodes":[{"id":"consent","label":"Optional e-KYC consent","kind":"decision","customer":"Can accept or refuse Shared e-KYC. Refusal must not block local KYC.","system":"Records SHARED_EKYC_READ consent version.","state":"CONSENT_CAPTURED","from":"","to":""},{"id":"lookup","label":"Network lookup","kind":"wait","customer":"Short wait. No dark pattern to force consent.","system":"Adapter query. Bank stays responsible for CDD.","state":"CONSENT_CAPTURED","from":"","to":""},{"id":"hit","label":"KYC found","kind":"action","customer":"Sees We found your KYC — review details.","system":"Prefills editable fields. Never skips sanctions or BV.","state":"EKYC_PREFILL_APPLIED","from":"","to":""},{"id":"miss","label":"No shared KYC","kind":"action","customer":"Sees No shared KYC — continue. Same as manual path.","system":"Timeout/miss is non-blocking.","state":"skip prefill","from":"","to":""},{"id":"review","label":"Customer confirms fields","kind":"action","customer":"Edits anything wrong. Confirms identity fields.","system":"Stores confirmed Table-A values.","state":"IDENTITY_CAPTURED","from":"","to":""},{"id":"continue","label":"Live photo + BV","kind":"success","customer":"Still captures live photo and NADRA BV.","system":"Same verification policy as UJ-01.","state":"LIVE_PHOTO_CAPTURED → IDENTITY_VERIFIED","from":"","to":""}],"edges":[{"from":"consent","to":"lookup","label":"accepted"},{"from":"lookup","to":"hit","label":"hit"},{"from":"lookup","to":"miss","label":"miss/timeout"},{"from":"hit","to":"review","label":""},{"from":"miss","to":"continue","label":""},{"from":"review","to":"continue","label":""}]},{"id":"UJ-03","family":"A","title":"Expired CNIC + NADRA token","persona":"Hamza — ID expired, token in hand","classTag":"A token path · renew in 3 months","why":"Expired CNIC can open if NADRA token/receipt is captured. Renewed ID is due within 3 months (UJ-31).","trigger":"Enters expired CNIC and has NADRA renewal receipt/token.","success":"Application continues. Renewal timer starts. May still reach ACTIVE.","alternate":"No token → cannot proceed on expired ID.","related":["UJ-01","UJ-31"],"walk":["id","expired","token","timer","continue"],"nodes":[{"id":"id","label":"Enter CNIC","kind":"action","customer":"Enters CNIC that NADRA shows as expired.","system":"Detects expiry vs today.","state":"IDENTITY_CAPTURED pending","from":"","to":""},{"id":"expired","label":"Expired?","kind":"decision","customer":"Helper text: need NADRA token/receipt to continue.","system":"Blocks continue without token artefact.","state":"IDENTITY_CAPTURED","from":"","to":""},{"id":"token","label":"Capture token","kind":"action","customer":"Uploads expired ID plus NADRA token/receipt.","system":"Stores artefact. Flags document_pending.","state":"IDENTITY_CAPTURED","from":"","to":""},{"id":"none","label":"No token — stop","kind":"fail","customer":"Cannot continue until token is available.","system":"Stay at identity. No account.","state":"IDENTITY_CAPTURED","from":"","to":""},{"id":"timer","label":"3-month timer","kind":"wait","customer":"Told renewed CNIC is required within 3 months.","system":"Schedules reminders (handoff UJ-31).","state":"exception + reminder","from":"","to":""},{"id":"continue","label":"Rest of onboarding","kind":"success","customer":"Live photo, BV or alternate, profile, submit.","system":"Same spine as UJ-01 after identity.","state":"may be ACTIVE or RESTRICTED_ACTIVE","from":"","to":""}],"edges":[{"from":"id","to":"expired","label":""},{"from":"expired","to":"token","label":"has token"},{"from":"expired","to":"none","label":"no token"},{"from":"token","to":"timer","label":""},{"from":"timer","to":"continue","label":""}]},{"id":"UJ-04","family":"A","title":"OTP fail / lockout / change number","persona":"Ayesha — mistypes OTP","classTag":"A MSISDN · B/C OTP security","why":"Wrong OTP never skips CONTACT_VERIFIED. After N fails, cool-down. Change number is a new attempt.","trigger":"Wrong OTP, expiry, or customer wants a different mobile.","success":"Mobile verified → CONTACT_VERIFIED. Then SMS Tracking ID.","alternate":"Cool-down. Support via Tracking ID shown in-app (UJ-27).","related":["UJ-01","UJ-27"],"walk":["enter","otp","wrong","retry","ok"],"nodes":[{"id":"enter","label":"Enter mobile","kind":"action","customer":"Types mobile. Helper: PTA-registered in own name.","system":"Start OTP. Attempt counters.","state":"INITIATED","from":"","to":""},{"id":"otp","label":"Enter OTP","kind":"decision","customer":"Enters code from SMS.","system":"No OTP in logs. Confirm or fail.","state":"INITIATED","from":"","to":""},{"id":"wrong","label":"Wrong / expired","kind":"fail","customer":"Retry prompt. Remaining attempts shown.","system":"Does not advance state.","state":"INITIATED","from":"","to":""},{"id":"retry","label":"Retry","kind":"action","customer":"Requests new OTP or re-enters.","system":"Resend with limits.","state":"INITIATED","from":"","to":""},{"id":"lock","label":"Lockout cool-down","kind":"wait","customer":"Sees timer. Cannot brute-force.","system":"Cool-down. Still INITIATED.","state":"INITIATED","from":"","to":""},{"id":"change","label":"Change number","kind":"action","customer":"Optional new number. New attempt rules explained.","system":"New OTP cycle. Fraud rules apply.","state":"INITIATED","from":"","to":""},{"id":"ok","label":"Verified","kind":"success","customer":"Mobile verified badge.","system":"Bind MSISDN. SMS Tracking ID.","state": equire assisted channel if Form-B is not eligible digitally.","related":["UJ-01","UJ-37"],"walk":["guard","minor","channel","open"],"nodes":[{"id":"guard","label":"Guardian KYC","kind":"action","customer":"Adult ID + BV + consents.","system":"Party role guardian. Screen guardian.","state":"guardian verified","from":"","to":""},{"id":"minor","label":"Minor identity","kind":"action","customer":"Form-B / Juvenile details. Purpose/SoF of funds.","system":"No anonymous accounts.","state":"minor captured","from":"","to":""},{"id":"channel","label":"Digital allowed?","kind":"decision","customer":"If remote not allowed, assisted/Phase 2 channel.","system":"Consolidated digital IDs may not include Form-B. Confirm Legal.","state":"policy","from":"","to":""},{"id":"block","label":"Assisted channel","kind":"wait","customer":"Cannot finish remote-only.","system":"Out of v1 digital allow-list unless Legal confirms.","state":"blocked remote","from":"","to":""},{"id":"open","label":"Minor account","kind":"success","customer":"Guardian operates the mandate.","system":"TAT typically 2 WD unless Legal says otherwise.","state":"ACTIVE (mandate)","from":"","to":""}],"edges":[{"from":"guard","to":"minor","label":""},{"from":"minor","to":"channel","label":""},{"from":"channel","to":"open","label":"allowed"},{"from":"channel","to":"block","label":"not digital"}]},{"id":"UJ-37","family":"F","title":"Mandate / authorized operator","persona":"Phase 2 — operator KYC","classTag":"A CDD on persons acting","why":"Operator completes own identity/BV/consents. Sanctions on operator can block the mandate without closing the primary.","trigger":"Existing customer adds an authorized operator, or opens with mandate.","success":"Operator transacts within mandate limits.","alternate":"Operator sanctions/PEP → block mandate, not necessarily close primary.","related":["UJ-35","UJ-01"],"walk":["add","confirm","opkyc","active"],"nodes":[{"id":"add","label":"Add operator","kind":"action","customer":"Primary starts add authorized operator.","system":"Party role mandate.","state":"ACTIVE primary","from":"","to":""},{"id":"confirm","label":"Primary confirms","kind":"action","customer":"Confirms mandate scope.","system":"Limits on operator actions.","state":"pending operator","from":"","to":""},{"id":"opkyc","label":"Operator KYC","kind":"action","customer":"Operator does identity, BV, consents.","system":"Screen operator (**A** associated person).","state":"operator verification","from":"","to":""},{"id":"active","label":"Mandate active","kind":"success","customer":"Operator can transact within limits.","system":"Mandate recorded.","state":"mandate live","from":"","to":""},{"id":"blockop","label":"Block operator","kind":"fail","customer":"Operator cannot be added. Primary account can remain.","system":"Sanctions/PEP on operator.","state":"primary ACTIVE, mandate no","from":"","to":""}],"edges":[{"from":"add","to":"confirm","label":""},{"from":"confirm","to":"opkyc","label":""},{"from":"opkyc","to":"active","label":"clear"},{"from":"opkyc","to":"blockop","label":"hit"}]},{"id":"UJ-38","family":"F","title":"Entity / SME + UBO","persona":"Phase 2 — P6 entity","classTag":"A UBO · A TAT 5 WD","why":"Business account is Phase 2. Identify UBOs (20% generally / 10% EDD — confirm Legal). TAT max 5 working days. Not the v1 individual state machine.","trigger":"Business account (Phase 2 / P6).","success":"Entity CIF + account. UBOs stored.","alternate":"Incomplete UBO → more info. Sanctions on BO → reject.","related":["UJ-21","UJ-26"],"walk":["intake","ubo","screen","wait","open"],"nodes":[{"id":"intake","label":"Entity intake","kind":"action","customer":"Incorporation docs, addresses, consents.","system":"entities table. Not v1 individual SM.","state":"entity application","from":"","to":""},{"id":"ubo","label":"Identify UBOs","kind":"action","customer":"Each UBO/controller identified and verified.","system":"beneficial_owners. 20% / 10% EDD — confirm Legal.","state":"UBO capture","from":"","to":""},{"id":"screen","label":"Screen entity + BOs","kind":"action","customer":"Waits.","system":"Sanctions each associated person. EDD if complex ownership.","state":"screening","from":"","to":""},{"id":"wait","label":"TAT ≤ 5 WD","kind":"wait","customer":"Tracking ID. Longer TAT than individuals (2 WD).","system":"Entity TAT **A** 5 working days.","state":"review","from":"","to":""},{"id":"open","label":"Entity account","kind":"success","customer":"Business CIF + account.","system":"UBOs stored.","state":"ACTIVE entity","from":"","to":""},{"id":"info","label":"More UBO info","kind":"action","customer":"Checklist of missing ownership evidence.","system":"Additional information.","state":"info required","from":"","to":""},{"id":"rej","label":"BO sanctions reject","kind":"fail","customer":"Written reason.","system":"Fail closed.","state":"REJECTED","from":"","to":""}],"edges":[{"from":"intake","to":"ubo","label":""},{"from":"ubo","to":"screen","label":""},{"from":"screen","to":"wait","label":""},{"from":"wait","to":"open","label":"approve"},{"from":"wait","to":"info","label":"gaps"},{"from":"wait","to":"rej","label":"sanctions"},{"from":"info","to":"screen","label":""}]}];

const familyNames = {
  A: "Onboarding",
  B: "Identity exceptions",
  C: "ID and residency",
  D: "Risk and decision",
  E: "Lifecycle",
  F: "Phase 2 summary"
};
const FILTERS = [
  ["ALL", "All"],
  ["A", "A Onboarding"],
  ["B", "B Identity"],
  ["C", "C ID types"],
  ["D", "D Risk"],
  ["E", "E Lifecycle"],
  ["F", "F Phase 2"]
];

let family = "ALL";
let current = "UJ-01";
let selected = null;
let query = "";
let scale = 1;
let tx = 0;
let ty = 0;

const $ = (id) => document.getElementById(id);
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (m) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

function listJourneys() {
  const q = query.trim().toLowerCase();
  return DATA.filter((j) => {
    if (family !== "ALL" && j.family !== family) return false;
    if (!q) return true;
    return (j.id + " " + j.title + " " + j.persona + " " + j.why).toLowerCase().includes(q);
  });
}

function renderFilters() {
  $("filters").innerHTML = FILTERS.map(([id, label]) =>
    `<button type="button" class="${family === id ? "active" : ""}" data-family="${id}">${label}</button>`
  ).join("");
}

function renderJourneys() {
  const list = listJourneys();
  $("journeys").innerHTML = list.map((j) =>
    `<button type="button" class="journey ${j.id === current ? "active" : ""}" data-id="${j.id}"><span>${j.id}</span>${esc(j.title)}</button>`
  ).join("");
}

function selectJourney(id) {
  current = id;
  selected = null;
  renderJourneys();
  renderJourney();
}

function renderJourney() {
  const j = DATA.find((x) => x.id === current) || DATA[0];
  $("title").textContent = j.id + " — " + j.title;
  $("meta").textContent = j.persona + "  ·  Family " + j.family + " " + familyNames[j.family] + "  ·  " + j.classTag;
  $("why").textContent = j.why;
  $("facts").innerHTML = ["Trigger", "Success", "Alternate"].map((k, i) => {
    const val = [j.trigger, j.success, j.alternate][i];
    return `<div class="fact"><b>${k}</b><span>${esc(val)}</span></div>`;
  }).join("");
  draw(j);
}

function layout(j) {
  const W = 228, H = 112, XG = 48, YG = 72, pad = 28;
  const indeg = {};
  j.nodes.forEach((n) => { indeg[n.id] = 0; });
  j.edges.forEach((e) => { if (indeg[e.to] != null) indeg[e.to] += 1; });
  const levels = {};
  const roots = j.nodes.filter((n) => indeg[n.id] === 0).map((n) => n.id);
  roots.forEach((id) => { levels[id] = 0; });
  const q = [...roots];
  let guard = 0;
  while (q.length && guard++ < 2000) {
    const a = q.shift();
    const lv = levels[a] || 0;
    j.edges.filter((e) => e.from === a).forEach((e) => {
      if (levels[e.to] == null || levels[e.to] < lv + 1) levels[e.to] = lv + 1;
      if (!q.includes(e.to)) q.push(e.to);
    });
  }
  j.nodes.forEach((n, i) => {
    if (levels[n.id] == null) {
      const w = j.walk.indexOf(n.id);
      levels[n.id] = w >= 0 ? w : i;
    }
  });
  const cols = {};
  j.nodes.forEach((n) => {
    (cols[levels[n.id]] ??= []).push(n);
  });
  const pos = {};
  const maxCols = Math.max(...Object.values(cols).map((c) => c.length));
  Object.keys(cols).forEach((c) => {
    const row = cols[c];
    const rowWidth = row.length * W + (row.length - 1) * XG;
    const full = maxCols * W + (maxCols - 1) * XG;
    const offset = Math.max(0, (full - rowWidth) / 2);
    row.forEach((n, i) => {
      pos[n.id] = { x: pad + offset + i * (W + XG), y: pad + Number(c) * (H + YG) };
    });
  });
  const maxX = Math.max(...Object.values(pos).map((p) => p.x)) + W + pad;
  const maxY = Math.max(...Object.values(pos).map((p) => p.y)) + H + pad;
  return { pos, W, H, maxX, maxY };
}

function draw(j) {
  const svg = $("svg");
  const g = $("viewport");
  g.innerHTML = "";
  const { pos, W, H, maxX, maxY } = layout(j);
  svg.setAttribute("viewBox", `0 0 ${maxX} ${maxY}`);
  svg.style.width = maxX + "px";
  svg.style.height = maxY + "px";
  const walkSet = new Set(j.walk);
  j.edges.forEach((e) => {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return;
    const x1 = a.x + W / 2, y1 = a.y + H, x2 = b.x + W / 2, y2 = b.y;
    const cy = (y1 + y2) / 2;
    g.insertAdjacentHTML("beforeend",
      `<path class="edge" d="M${x1},${y1} C${x1},${cy} ${x2},${cy} ${x2},${y2}"/>` +
      (e.label ? `<text class="edge-label" x="${(x1 + x2) / 2}" y="${cy - 6}" text-anchor="middle">${esc(e.label)}</text>` : "")
    );
  });
  const focus = selected || j.walk[0] || j.nodes[0].id;
  j.nodes.forEach((n) => {
    const p = pos[n.id];
    const sel = n.id === focus;
    g.insertAdjacentHTML("beforeend", `
      <g class="node ${esc(n.kind)} ${sel ? "selected" : ""}" transform="translate(${p.x},${p.y})" data-node="${esc(n.id)}">
        <rect class="box" rx="8" width="${W}" height="${H}"></rect>
        <rect class="bar" x="0" y="0" width="4" height="${H}" rx="2"></rect>
        <foreignObject x="0" y="0" width="${W}" height="${H}">
          <div xmlns="http://www.w3.org/1999/xhtml" class="node-html">
            <div class="n-label">${esc(n.label)}</div>
            <div class="n-kind">${esc(n.kind)}${walkSet.has(n.id) ? " · main path" : ""}</div>
            <div class="n-state">${esc(n.state)}</div>
          </div>
        </foreignObject>
      </g>`);
  });
  updateCount(j, focus);
  showDetails(j, focus);
  resetView();
}

function showDetails(j, id) {
  const n = j.nodes.find((x) => x.id === id) || j.nodes[0];
  const next = j.edges.filter((e) => e.from === n.id).map((e) => {
    const dest = j.nodes.find((x) => x.id === e.to);
    return (e.label ? esc(e.label) + " → " : "") + esc(dest ? dest.label : e.to);
  });
  const related = (j.related || []).map((rid) => {
    const rj = DATA.find((x) => x.id === rid);
    return `<button type="button" data-id="${rid}">${rid} ${esc(rj ? rj.title : "")}</button>`;
  }).join("");
  $("details").innerHTML = `
    <div>
      <p class="step-title">${esc(n.label)}<span class="badge">${esc(n.kind)}</span></p>
      <h3>State</h3>
      <p>${esc(n.state)}</p>
    </div>
    <div><h3>Customer sees / does</h3><p>${esc(n.customer)}</p></div>
    <div><h3>System does</h3><p>${esc(n.system)}</p></div>
    <div>
      <h3>Next</h3>
      <p>${next.length ? next.join("<br>") : "End of this branch"}</p>
      ${related ? `<h3 style="margin-top:12px">Related journeys</h3><div class="related">${related}</div>` : ""}
    </div>`;
}

function updateCount(j, id) {
  const i = j.walk.indexOf(id);
  $("count").textContent = i >= 0
    ? `Main path ${i + 1} of ${j.walk.length}`
    : `Branch step · main path has ${j.walk.length} steps`;
}

function walk(delta) {
  const j = DATA.find((x) => x.id === current) || DATA[0];
  const id = selected || j.walk[0] || j.nodes[0].id;
  let i = j.walk.indexOf(id);
  if (i < 0) i = 0;
  i = Math.max(0, Math.min(j.walk.length - 1, i + delta));
  selected = j.walk[i];
  draw(j);
}

function applyTransform() {
  $("viewport").setAttribute("transform", `translate(${tx} ${ty}) scale(${scale})`);
}
function resetView() {
  scale = 1;
  tx = 20;
  ty = 16;
  applyTransform();
}
function zoom(f) {
  scale = Math.max(0.6, Math.min(1.8, scale * f));
  applyTransform();
}
function fit() {
  const svg = $("svg");
  const vb = svg.viewBox.baseVal;
  const canvas = $("canvas");
  const w = canvas.clientWidth;
  if (vb.width && w && vb.width > w - 40) {
    scale = (w - 40) / vb.width;
  } else {
    scale = 1;
  }
  tx = 20;
  ty = 16;
  applyTransform();
}

function bind() {
  $("filters").addEventListener("click", (e) => {
    const b = e.target.closest("[data-family]");
    if (!b) return;
    family = b.getAttribute("data-family");
    const list = listJourneys();
    if (!list.some((j) => j.id === current) && list[0]) current = list[0].id;
    selected = null;
    renderFilters();
    renderJourneys();
    renderJourney();
  });
  $("journeys").addEventListener("click", (e) => {
    const b = e.target.closest("[data-id]");
    if (b) selectJourney(b.getAttribute("data-id"));
  });
  $("q").addEventListener("input", (e) => {
    query = e.target.value;
    renderJourneys();
  });
  $("svg").addEventListener("click", (e) => {
    const g = e.target.closest("[data-node]");
    if (!g) return;
    selected = g.getAttribute("data-node");
    const j = DATA.find((x) => x.id === current);
    draw(j);
  });
  $("details").addEventListener("click", (e) => {
    const b = e.target.closest("[data-id]");
    if (b) selectJourney(b.getAttribute("data-id"));
  });
  $("prevBtn").addEventListener("click", () => walk(-1));
  $("nextBtn").addEventListener("click", () => walk(1));
  $("zoomIn").addEventListener("click", () => zoom(1.12));
  $("zoomOut").addEventListener("click", () => zoom(0.9));
  $("fitBtn").addEventListener("click", () => fit());
  window.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight") walk(1);
    if (e.key === "ArrowLeft") walk(-1);
  });
}

renderFilters();
renderJourneys();
bind();
renderJourney();
</script>
</body>
