<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMI wallet KYC journeys</title>
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --ink: #1a2332;
    --muted: #5c6b80;
    --line: #d8dee8;
    --line-strong: #c3ccd8;
    --accent: #1e4e8c;
    --accent-soft: #e8f0fa;
    --success: #0f6b45;
    --success-soft: #e6f5ee;
    --danger: #b42318;
    --danger-soft: #fdecea;
    --warn: #8a5a00;
    --warn-soft: #fff6e0;
    --wait: #5b4aa8;
    --wait-soft: #f1eefc;
    --shadow: 0 0 0 1px var(--line);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  .app {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    height: 100%;
  }
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .brand {
    padding: 20px 18px 12px;
    border-bottom: 1px solid var(--line);
  }
  .brand h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  .brand p {
    margin: 6px 0 0;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.45;
  }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 18px 0;
  }
  .filters button, .toolbar button, .walk button, .related button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 12px;
  }
  .filters button.active, .journey.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .search {
    padding: 10px 18px 8px;
  }
  .search input {
    width: 100%;
    font: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
  }
  .search input:focus {
    outline: 2px solid var(--accent-soft);
    border-color: var(--accent);
  }
  .journeys {
    flex: 1;
    overflow: auto;
    padding: 4px 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .journey {
    display: flex;
    gap: 8px;
    align-items: baseline;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink);
  }
  .journey:hover { background: var(--accent-soft); }
  .journey span {
    flex: 0 0 62px;
    font-size: 11px;
    font-weight: 650;
    color: var(--muted);
  }
  .journey.active span { color: #cfe0f5; }
  .legend {
    padding: 12px 18px 16px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 12px;
  }
  .legend i {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: middle;
  }
  .main {
    display: grid;
    grid-template-rows: auto minmax(480px, 1fr) minmax(280px, 34vh);
    min-width: 0;
    min-height: 0;
  }
  .top {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 12px 22px 10px;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
  }
  .title {
    margin: 0;
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.03em;
  }
  .meta { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .why {
    margin-top: 8px;
    padding: 8px 10px;
    background: var(--accent-soft);
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.4;
  }
  .facts {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }
  .fact {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    background: var(--bg);
  }
  .fact b {
    display: block;
    font-size: 11px;
    color: var(--muted);
    font-weight: 650;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .fact span { font-size: 12px; line-height: 1.4; }
  .toolbar { display: flex; gap: 6px; flex-shrink: 0; }
  .walk { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .walk .count { font-size: 12px; color: var(--muted); }
  .canvas {
    position: relative;
    overflow: auto;
    background: var(--bg);
    min-height: 480px;
  }
  svg { display: block; }
  .node { cursor: pointer; }
  .node .box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; }
  .node.selected .box { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
  .node.success .bar { fill: var(--success); }
  .node.fail .bar { fill: var(--danger); }
  .node.decision .bar { fill: var(--warn); }
  .node.wait .bar { fill: var(--wait); }
  .node.action .bar { fill: var(--accent); }
  .node-html {
    font-family: "Segoe UI", system-ui, sans-serif;
    padding: 8px 10px 8px 14px;
    height: 100%;
  }
  .n-label {
    font-size: 14px;
    font-weight: 650;
    line-height: 1.3;
    color: var(--ink);
  }
  .n-kind {
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .n-state {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .edge { fill: none; stroke: #8b9bb0; stroke-width: 1.4; marker-end: url(#arrow); }
  .edge-label {
    font-size: 10px;
    fill: #5c6b80;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .details {
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 16px 22px 18px;
    display: grid;
    grid-template-columns: 1.1fr 1.3fr 1.3fr 1fr;
    gap: 18px;
    min-height: 280px;
    overflow: auto;
  }
  .details h3 {
    margin: 0 0 6px;
    font-size: 11px;
    font-weight: 650;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .details p { margin: 0; font-size: 13px; line-height: 1.5; }
  .step-title { font-size: 16px; font-weight: 650; margin: 0 0 6px; }
  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--muted);
    margin-left: 6px;
    vertical-align: middle;
    text-transform: uppercase;
  }
  .related { display: flex; flex-wrap: wrap; gap: 6px; }
  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 220px 1fr; }
    .facts { grid-template-columns: 1fr; }
    .details { grid-template-columns: 1fr; min-height: 240px; }
    .main { grid-template-rows: auto minmax(360px, 1fr) minmax(240px, 40vh); }
    .canvas { min-height: 360px; }
  }

  .eyebrow {
    margin: 0 0 4px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--accent);
  }
  .pack-links {
    margin: 8px 0 0;
    font-size: 12px;
  }
  .pack-links a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 650;
  }
  .pack-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <p class="eyebrow">Pakistan EMI · Sep 2026</p>
      <h1>Wallet KYC journeys</h1>
      <p>20 customer-facing paths. Click a journey, then a step. Not legal advice.</p>
      <p class="pack-links"><a href="index.html">Pack home</a> · <a href="05c-emi-customer-journeys.pdf">PDF</a> · <a href="05b-emi-user-journeys-catalog.html">Catalog</a></p>
    </div>
    <div id="filters" class="filters"></div>
    <div class="search"><input id="q" type="search" placeholder="Search journeys, personas, IDs" autocomplete="off"></div>
    <div id="journeys" class="journeys"></div>
    <div class="legend">
      <div><i style="background:#1e4e8c"></i>Action</div>
      <div><i style="background:#8a5a00"></i>Decision</div>
      <div><i style="background:#0f6b45"></i>Success</div>
      <div><i style="background:#b42318"></i>Fail / stop</div>
      <div><i style="background:#5b4aa8"></i>Wait</div>
      <div>Source: EMI 05b catalog</div>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="top-row">
        <div>
          <h2 id="title" class="title"></h2>
          <p id="meta" class="meta"></p>
        </div>
        <div class="toolbar">
          <button type="button" id="zoomOut">-</button>
          <button type="button" id="zoomIn">+</button>
          <button type="button" id="fitBtn">Fit</button>
        </div>
      </div>
      <div id="why" class="why"></div>
      <div id="facts" class="facts"></div>
      <div class="walk">
        <button type="button" id="prevBtn">Previous step</button>
        <button type="button" id="nextBtn">Next step</button>
        <span id="count" class="count"></span>
      </div>
    </header>
    <section id="canvas" class="canvas">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 z" fill="#8b9bb0"></path>
          </marker>
        </defs>
        <g id="viewport"></g>
      </svg>
    </section>
    <section id="details" class="details"></section>
  </main>
</div>
<script>
const DATA=[{"id":"UJ-E01","family":"A","title":"Verisys wallet 50k","persona":"Ayesha — first EMI wallet","classTag":"A EMI §12 / §14.II · A live photo / TAT","why":"Digital wallet opens on NADRA Verisys plus screening. Monthly load is PKR 50,000. This is e-money, not a bank deposit.","trigger":"Taps Open wallet. Eligible digital ID. Verisys and TFS clear.","success":"WALLET_ACTIVE · VERISYS. Load 50k/month. Cash-out 10k/day.","alternate":"Duplicate CNIC, OTP fail, sanctions, NADRA outage (UJ-E05–E11).","related":["UJ-E02","UJ-E05","UJ-E06","UJ-E09"],"walk":["open","track","otp","sms","consent","id","photo","screen","verisys","home"],"nodes":[{"id":"open","label":"Open wallet","kind":"action","customer":"Opens app or web and taps Open wallet.","system":"Creates application. Channel, device hash, IP, geo if permitted. Not a bank CIF.","state":"INITIATED"},{"id":"track","label":"Tracking ID on screen","kind":"action","customer":"Sees Tracking ID. Can copy it. No SMS yet.","system":"Issues Tracking ID in-app only. No destination until OTP.","state":"INITIATED"},{"id":"otp","label":"Mobile OTP · 2FA","kind":"action","customer":"Enters PTA-registered mobile and OTP.","system":"2FA required (EMI §12). Does not skip state on wrong OTP.","state":"CONTACT_VERIFIED"},{"id":"sms","label":"SMS Tracking ID","kind":"action","customer":"Receives SMS: wallet application started + Tracking ID.","system":"First out-of-band notify only after OTP success.","state":"CONTACT_VERIFIED"},{"id":"consent","label":"Consents and fees","kind":"action","customer":"Accepts T&Cs, privacy, NADRA/BV, fee schedule. Marketing off by default.","system":"Versioned consents. Blocks continue until mandatory accepted.","state":"CONSENT_CAPTURED"},{"id":"id","label":"Identity + Table-A","kind":"action","customer":"CNIC/NICOP/POC/POR/ARC. Two extra non-CNIC fields. Live CNIC image.","system":"EMI §12 minimum + Consolidated Table-A. CNIC uniqueness check.","state":"IDENTITY_CAPTURED"},{"id":"photo","label":"Live photo","kind":"action","customer":"Centers face. Captures live photo. Good light, no mask.","system":"Encrypted upload. Face match vs ID. Liveness is not NADRA BV.","state":"LIVE_PHOTO_CAPTURED"},{"id":"screen","label":"Sanctions / PEP","kind":"success","customer":"Sees Under review. Does not see list names.","system":"UNSC + ATA + PEP + watchlist before payment-service use. Fail closed if provider down.","state":"SCREENING_IN_PROGRESS → clear"},{"id":"verisys","label":"NADRA Verisys","kind":"success","customer":"Wallet ready — 50,000 per month.","system":"Activate after §12 verify + pre-screen. limit_tier=VERISYS.","state":"WALLET_ACTIVE · VERISYS"},{"id":"home","label":"Home + Increase limit","kind":"success","customer":"Balance, pay, IBFT in. Banner to complete biometric for 400k.","system":"Ledger enforces 50k load and 10k/day cash-out. Trust posting at par when funded.","state":"WALLET_ACTIVE"}],"edges":[{"from":"open","to":"track","label":""},{"from":"track","to":"otp","label":""},{"from":"otp","to":"sms","label":""},{"from":"sms","to":"consent","label":""},{"from":"consent","to":"id","label":""},{"from":"id","to":"photo","label":""},{"from":"photo","to":"screen","label":""},{"from":"screen","to":"verisys","label":""},{"from":"verisys","to":"home","label":""}]},{"id":"UJ-E02","family":"A","title":"NADRA BV upgrade 400k","persona":"Ayesha — needs higher load","classTag":"A EMI §14 · channel D","why":"Biometric verification raises commercial monthly load to PKR 400,000 (pilot: 200,000). Selfie is not BV.","trigger":"Taps Increase limit on a VERISYS wallet.","success":"limit_tier=BV. Banner shows new monthly load. Cash-out from CRP.","alternate":"BV fail → UJ-E07. NADRA down → UJ-E08.","related":["UJ-E01","UJ-E03","UJ-E07"],"walk":["cta","channel","bv","lift"],"nodes":[{"id":"cta","label":"Increase limit","kind":"action","customer":"Taps Increase my limit. Told SBP 50k vs 400k.","system":"Starts BV session. Reads licence_phase.","state":"WALLET_ACTIVE · VERISYS"},{"id":"channel","label":"How to do BV","kind":"decision","customer":"In-app fingerprint/face, NADRA e-Sahulat, or partner ATM.","system":"Same application. Authenticated BV channel.","state":"IDENTITY_VERIFICATION_IN_PROGRESS"},{"id":"app","label":"In-app BVS","kind":"action","customer":"Scans fingerprint/face in Pakistan.","system":"NADRA BV adapter. No raw template store.","state":"IN_PROGRESS"},{"id":"offline","label":"e-Sahulat / ATM","kind":"action","customer":"Completes BV at NADRA agent or partner ATM (no card if offered).","system":"Receipt/ATM adapter. Confirm BV not CNIC-only Verisys.","state":"IN_PROGRESS"},{"id":"bv","label":"NADRA BV success","kind":"success","customer":"Limit increased.","system":"400k commercial or 200k pilot. Cash-out from CRP.","state":"WALLET_ACTIVE · BV"},{"id":"lift","label":"New limit banner","kind":"success","customer":"Sees 400,000 per month (or 200k if pilot).","system":"Ledger policy switch. Alerts continue.","state":"WALLET_ACTIVE · BV"},{"id":"fail","label":"BV fails","kind":"fail","customer":"Retry, e-Sahulat, or video KYC. Wallet stays 50k.","system":"Do not fake BV. Stay VERISYS.","state":"VERISYS"}],"edges":[{"from":"cta","to":"channel","label":""},{"from":"channel","to":"app","label":"in-app"},{"from":"channel","to":"offline","label":"offline"},{"from":"app","to":"bv","label":"success"},{"from":"offline","to":"bv","label":"success"},{"from":"app","to":"fail","label":"fail"},{"from":"offline","to":"fail","label":"fail"},{"from":"bv","to":"lift","label":""}]},{"id":"UJ-E03","family":"A","title":"Enhanced wallet 1M","persona":"Sana — SoF + PSP&OD product","classTag":"A EMI §14.III not outsourced","why":"After commercial licence, PSP&OD may allow up to PKR 1,000,000 if SoF, CNIC-SIM pairing, TMS, and CRP are done in-house.","trigger":"BV wallet. EMI has enhanced product approval. Customer requests.","success":"limit_tier=ENHANCED up to 1M.","alternate":"Missing SoF or pairing → remain BV.","related":["UJ-E02","UJ-E11"],"walk":["ask","sof","sim","tms","wait","ok"],"nodes":[{"id":"ask","label":"Request enhanced","kind":"action","customer":"Taps higher limit / enhanced wallet.","system":"Checks commercial licence + PSP&OD flag.","state":"WALLET_ACTIVE · BV"},{"id":"sof","label":"Annexure-J SoF","kind":"action","customer":"Uploads income / source of funds.","system":"Stores artefacts. Verification not outsourced.","state":"ADDITIONAL_INFORMATION_REQUIRED"},{"id":"sim","label":"CNIC–SIM pairing","kind":"action","customer":"Confirms mobile ownership on this device.","system":"Pairs CNIC to SIM/device of the instrument.","state":"verification"},{"id":"tms","label":"TMS + CRP","kind":"wait","customer":"Waits. Tracking ID visible.","system":"Robust TMS scenarios + detailed risk profile. In-house.","state":"EDD_REQUIRED / review"},{"id":"wait","label":"PSP&OD path already live","kind":"decision","customer":"Does not see regulator UI.","system":"Product already approved; this is per-customer control check.","state":"review"},{"id":"ok","label":"Enhanced live","kind":"success","customer":"Sees higher limit banner.","system":"limit_tier=ENHANCED. Ledger cap 1M.","state":"WALLET_ACTIVE · ENHANCED"},{"id":"keep","label":"Remain BV","kind":"fail","customer":"Told what is still missing.","system":"No silent 1M.","state":"WALLET_ACTIVE · BV"}],"edges":[{"from":"ask","to":"sof","label":""},{"from":"sof","to":"sim","label":""},{"from":"sim","to":"tms","label":""},{"from":"tms","to":"wait","label":""},{"from":"wait","to":"ok","label":"pass"},{"from":"wait","to":"keep","label":"fail"}]},{"id":"UJ-E04","family":"B","title":"One credit then unverified close + STR","persona":"Policy-enabled pre-verify credit","classTag":"A EMI §12.IV","why":"EMI may allow one credit before credentials are verified. If verification fails, close the instrument and file STR. Recommended default is off.","trigger":"Product flag allows one inbound before NADRA/screen complete.","success":"If later verified → continue UJ-E01. If not → closed + STR.","alternate":"Prefer disable this flag and verify first.","related":["UJ-E01","UJ-E10"],"walk":["flag","credit","timer","failclose"],"nodes":[{"id":"flag","label":"Pre-verify credit on","kind":"decision","customer":"May see pending wallet.","system":"unverified_one_credit flag. Hard timeout.","state":"INITIATED / pending"},{"id":"credit","label":"One inbound","kind":"action","customer":"Receives one credit/IBFT.","system":"Ledger allows exactly one. No spend if policy stricter.","state":"pending verify"},{"id":"timer","label":"Verify window","kind":"wait","customer":"Prompted to finish KYC.","system":"NADRA + TFS still required.","state":"pending verify"},{"id":"ok","label":"Credentials verified","kind":"success","customer":"Wallet becomes VERISYS/BV per path.","system":"Clear flag. Continue UJ-E01.","state":"WALLET_ACTIVE"},{"id":"failclose","label":"Close + STR","kind":"fail","customer":"Wallet closed. Support copy without extra PII.","system":"CLOSED_UNVERIFIED. File STR with FMU.","state":"CLOSED_UNVERIFIED"}],"edges":[{"from":"flag","to":"credit","label":"enabled"},{"from":"credit","to":"timer","label":""},{"from":"timer","to":"ok","label":"verified"},{"from":"timer","to":"failclose","label":"not verified"}]},{"id":"UJ-E05","family":"B","title":"Duplicate CNIC — one wallet","persona":"Yasmin — already has this EMI wallet","classTag":"A EMI §12.VII","why":"A CNIC holder may open only one e-money instrument with this EMI. Copy must say You already have a wallet — not a vague reject.","trigger":"CNIC hash matches an open wallet at this EMI.","success":"Login / recovery to existing wallet.","alternate":"Closed wallet reopen policy — Legal.","related":["UJ-E01","UJ-E09"],"walk":["id","hit","copy","login"],"nodes":[{"id":"id","label":"Enter CNIC","kind":"action","customer":"Enters identity.","system":"Hash vs uniqueness key.","state":"IDENTITY_CAPTURED"},{"id":"hit","label":"Existing wallet","kind":"decision","customer":"Stopped from a secon const familyNames = {
  A: "Core wallet",
  B: "Identity exceptions",
  C: "AML and tracking",
  D: "Lifecycle"
};
const FILTERS = [
  ["ALL", "All"],
  ["A", "A Core"],
  ["B", "B Identity"],
  ["C", "C AML"],
  ["D", "D Lifecycle"]
];

let family = "ALL";
let current = "UJ-E01";
let selected = null;
let query = "";
let scale = 1;
let tx = 0;
let ty = 0;

const $ = (id) => document.getElementById(id);
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (m) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

function listJourneys() {
  const q = query.trim().toLowerCase();
  return DATA.filter((j) => {
    if (family !== "ALL" && j.family !== family) return false;
    if (!q) return true;
    return (j.id + " " + j.title + " " + j.persona + " " + j.why).toLowerCase().includes(q);
  });
}

function renderFilters() {
  $("filters").innerHTML = FILTERS.map(([id, label]) =>
    `<button type="button" class="${family === id ? "active" : ""}" data-family="${id}">${label}</button>`
  ).join("");
}

function renderJourneys() {
  const list = listJourneys();
  $("journeys").innerHTML = list.map((j) =>
    `<button type="button" class="journey ${j.id === current ? "active" : ""}" data-id="${j.id}"><span>${j.id}</span>${esc(j.title)}</button>`
  ).join("");
}

function selectJourney(id) {
  current = id;
  selected = null;
  renderJourneys();
  renderJourney();
}

function renderJourney() {
  const j = DATA.find((x) => x.id === current) || DATA[0];
  $("title").textContent = j.id + " — " + j.title;
  $("meta").textContent = j.persona + "  ·  Family " + j.family + " " + familyNames[j.family] + "  ·  " + j.classTag;
  $("why").textContent = j.why;
  $("facts").innerHTML = ["Trigger", "Success", "Alternate"].map((k, i) => {
    const val = [j.trigger, j.success, j.alternate][i];
    return `<div class="fact"><b>${k}</b><span>${esc(val)}</span></div>`;
  }).join("");
  draw(j);
}

function layout(j) {
  const W = 228, H = 112, XG = 48, YG = 72, pad = 28;
  const indeg = {};
  j.nodes.forEach((n) => { indeg[n.id] = 0; });
  j.edges.forEach((e) => { if (indeg[e.to] != null) indeg[e.to] += 1; });
  const levels = {};
  const roots = j.nodes.filter((n) => indeg[n.id] === 0).map((n) => n.id);
  roots.forEach((id) => { levels[id] = 0; });
  const q = [...roots];
  let guard = 0;
  while (q.length && guard++ < 2000) {
    const a = q.shift();
    const lv = levels[a] || 0;
    j.edges.filter((e) => e.from === a).forEach((e) => {
      if (levels[e.to] == null) {
        levels[e.to] = lv + 1;
        if (!q.includes(e.to)) q.push(e.to);
      }
    });
  }
  j.nodes.forEach((n, i) => {
    if (levels[n.id] == null) {
      const w = j.walk.indexOf(n.id);
      levels[n.id] = w >= 0 ? w : i;
    }
  });
  const cols = {};
  j.nodes.forEach((n) => {
    (cols[levels[n.id]] ??= []).push(n);
  });
  const pos = {};
  const maxCols = Math.max(...Object.values(cols).map((c) => c.length));
  Object.keys(cols).forEach((c) => {
    const row = cols[c];
    const rowWidth = row.length * W + (row.length - 1) * XG;
    const full = maxCols * W + (maxCols - 1) * XG;
    const offset = Math.max(0, (full - rowWidth) / 2);
    row.forEach((n, i) => {
      pos[n.id] = { x: pad + offset + i * (W + XG), y: pad + Number(c) * (H + YG) };
    });
  });
  const maxX = Math.max(...Object.values(pos).map((p) => p.x)) + W + pad;
  const maxY = Math.max(...Object.values(pos).map((p) => p.y)) + H + pad;
  return { pos, W, H, maxX, maxY };
}

function draw(j) {
  const svg = $("svg");
  const g = $("viewport");
  g.innerHTML = "";
  const { pos, W, H, maxX, maxY } = layout(j);
  svg.setAttribute("viewBox", `0 0 ${maxX} ${maxY}`);
  svg.style.width = maxX + "px";
  svg.style.height = maxY + "px";
  const walkSet = new Set(j.walk);
  j.edges.forEach((e) => {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return;
    const x1 = a.x + W / 2, y1 = a.y + H, x2 = b.x + W / 2, y2 = b.y;
    const cy = (y1 + y2) / 2;
    g.insertAdjacentHTML("beforeend",
      `<path class="edge" d="M${x1},${y1} C${x1},${cy} ${x2},${cy} ${x2},${y2}"/>` +
      (e.label ? `<text class="edge-label" x="${(x1 + x2) / 2}" y="${cy - 6}" text-anchor="middle">${esc(e.label)}</text>` : "")
    );
  });
  const focus = selected || j.walk[0] || j.nodes[0].id;
  j.nodes.forEach((n) => {
    const p = pos[n.id];
    const sel = n.id === focus;
    g.insertAdjacentHTML("beforeend", `
      <g class="node ${esc(n.kind)} ${sel ? "selected" : ""}" transform="translate(${p.x},${p.y})" data-node="${esc(n.id)}">
        <rect class="box" rx="8" width="${W}" height="${H}"></rect>
        <rect class="bar" x="0" y="0" width="4" height="${H}" rx="2"></rect>
        <foreignObject x="0" y="0" width="${W}" height="${H}">
          <div xmlns="http://www.w3.org/1999/xhtml" class="node-html">
            <div class="n-label">${esc(n.label)}</div>
            <div class="n-kind">${esc(n.kind)}${walkSet.has(n.id) ? " · main path" : ""}</div>
            <div class="n-state">${esc(n.state)}</div>
          </div>
        </foreignObject>
      </g>`);
  });
  updateCount(j, focus);
  showDetails(j, focus);
  resetView();
}

function showDetails(j, id) {
  const n = j.nodes.find((x) => x.id === id) || j.nodes[0];
  const next = j.edges.filter((e) => e.from === n.id).map((e) => {
    const dest = j.nodes.find((x) => x.id === e.to);
    return (e.label ? esc(e.label) + " → " : "") + esc(dest ? dest.label : e.to);
  });
  const related = (j.related || []).map((rid) => {
    const rj = DATA.find((x) => x.id === rid);
    return `<button type="button" data-id="${rid}">${rid} ${esc(rj ? rj.title : "")}</button>`;
  }).join("");
  $("details").innerHTML = `
    <div>
      <p class="step-title">${esc(n.label)}<span class="badge">${esc(n.kind)}</span></p>
      <h3>State</h3>
      <p>${esc(n.state)}</p>
    </div>
    <div><h3>Customer sees / does</h3><p>${esc(n.customer)}</p></div>
    <div><h3>System does</h3><p>${esc(n.system)}</p></div>
    <div>
      <h3>Next</h3>
      <p>${next.length ? next.join("<br>") : "End of this branch"}</p>
      ${related ? `<h3 style="margin-top:12px">Related journeys</h3><div class="related">${related}</div>` : ""}
    </div>`;
}

function updateCount(j, id) {
  const i = j.walk.indexOf(id);
  $("count").textContent = i >= 0
    ? `Main path ${i + 1} of ${j.walk.length}`
    : `Branch step · main path has ${j.walk.length} steps`;
}

function walk(delta) {
  const j = DATA.find((x) => x.id === current) || DATA[0];
  const id = selected || j.walk[0] || j.nodes[0].id;
  let i = j.walk.indexOf(id);
  if (i < 0) i = 0;
  i = Math.max(0, Math.min(j.walk.length - 1, i + delta));
  selected = j.walk[i];
  draw(j);
}

function applyTransform() {
  $("viewport").setAttribute("transform", `translate(${tx} ${ty}) scale(${scale})`);
}
function resetView() {
  scale = 1;
  tx = 20;
  ty = 16;
  applyTransform();
}
function zoom(f) {
  scale = Math.max(0.6, Math.min(1.8, scale * f));
  applyTransform();
}
function fit() {
  const svg = $("svg");
  const vb = svg.viewBox.baseVal;
  const canvas = $("canvas");
  const w = canvas.clientWidth;
  if (vb.width && w && vb.width > w - 40) {
    scale = (w - 40) / vb.width;
  } else {
    scale = 1;
  }
  tx = 20;
  ty = 16;
  applyTransform();
}

function bind() {
  $("filters").addEventListener("click", (e) => {
    const b = e.target.closest("[data-family]");
    if (!b) return;
    family = b.getAttribute("data-family");
    const list = listJourneys();
    if (!list.some((j) => j.id === current) && list[0]) current = list[0].id;
    selected = null;
    renderFilters();
    renderJourneys();
    renderJourney();
  });
  $("journeys").addEventListener("click", (e) => {
    const b = e.target.closest("[data-id]");
    if (b) selectJourney(b.getAttribute("data-id"));
  });
  $("q").addEventListener("input", (e) => {
    query = e.target.value;
    renderJourneys();
  });
  $("svg").addEventListener("click", (e) => {
    const g = e.target.closest("[data-node]");
    if (!g) return;
    selected = g.getAttribute("data-node");
    const j = DATA.find((x) => x.id === current);
    draw(j);
  });
  $("details").addEventListener("click", (e) => {
    const b = e.target.closest("[data-id]");
    if (b) selectJourney(b.getAttribute("data-id"));
  });
  $("prevBtn").addEventListener("click", () => walk(-1));
  $("nextBtn").addEventListener("click", () => walk(1));
  $("zoomIn").addEventListener("click", () => zoom(1.12));
  $("zoomOut").addEventListener("click", () => zoom(0.9));
  $("fitBtn").addEventListener("click", () => fit());
  window.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight") walk(1);
    if (e.key === "ArrowLeft") walk(-1);
  });
}

renderFilters();
renderJourneys();
bind();
renderJourney();
</script>
</body>
</html>
